<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simple coordinate distance and angle calculator.">
  <title>Coordinate Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Coordinate Calculator</h1>
      <p>Calculate distance and bearing between two coordinates.</p>
    </header>

    <section class="inputs">
      <div class="field">
        <label for="coord-a">POINT A</label>
        <input id="coord-a" type="text" value="x54.63, y75.82"
               autocomplete="off" spellcheck="false"
               aria-describedby="example-a">
        <div class="example" id="example-a">Format: x54.63, y75.82</div>
      </div>

      <div class="field">
        <label for="coord-b">POINT B</label>
        <input id="coord-b" type="text" value="x120.45, y32.17"
               autocomplete="off" spellcheck="false"
               aria-describedby="example-b">
        <div class="example" id="example-b">Format: x120.45, y32.17</div>
      </div>
    </section>

    <div class="status" id="status" aria-live="polite"></div>

    <section class="results" aria-label="Results">
      <div class="result">
        <div class="result-label">DISTANCE</div>
        <div>
          <span class="number" id="distance">—</span>
          <span class="unit">meter</span>
        </div>
      </div>

      <div class="result">
        <div class="result-label">ANGLE</div>
        <div>
          <span class="number" id="angle">—</span>
          <span class="unit">°</span>
        </div>
        <div class="angle-note">0° = +Y · clockwise</div>
      </div>
    </section>

    <section class="tutorial">
      <div class="tutorial-title">HOW TO COPY COORDINATES</div>
      <div class="tutorial-text">To copy coordinates from the map:
rightclick → mark coordinates → ctrl + a  -> ctrl + c</div>
    </section>

    <button class="clear" id="clear" type="button">Clear</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
